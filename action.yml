name: "generate-snake-game-from-github-contribution-grid"
description: "Generates a snake game from contribution grids (GitHub, GitLab, WakaTime). Output the animation as gif or svg"
author: "platane"

runs:
  using: docker
  image: docker://platane/snk@sha256:3a66a51ca8eaecc1e841bc8baae39bd88079e57419850d1ed005eee2bbfce940

inputs:
  github_user_name:
    description: "github user name (optional if gitlab_user or wakatime is set)"
    required: false
  github_token:
    description: "github token used to fetch the contribution calendar. Default to the action token if empty."
    required: false
    default: ${{ github.token }}
  gitlab_user:
    description: "GitLab username(s), optionally host/username. Multiple: one per line."
    required: false
  gitlab_base_url:
    description: "Override GitLab base URL for all gitlab_user entries without a host (e.g. https://gitlab.example.com)"
    required: false
  wakatime:
    description: "If true, include WakaTime activity (requires WAKATIME_API_KEY env)"
    required: false
    default: "false"
  outputs:
    required: false
    description: |
      list of files to generate.
      one file per line. Each output can be customized with options as query string.

       supported query string options:

      - palette:      A preset of color, one of [github, github-dark, github-light, sources, sources-dark, gitlab, ...]
      - color_snake:  Color of the snake
      - color_dots:   Coma separated list of dots color.
                      The first one is 0 contribution, then low to high (or bitmask combos for sources).
      example:
        outputs: |
          dark.svg?palette=sources-dark
          light.svg?palette=sources
